name: Compilar APK Android (UrbanRide Driver)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar UrbanRide-Driver.apk
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configurar Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter (Conductor)
        working-directory: apps/driver
        run: flutter pub get

      - name: Analizar código Dart
        working-directory: apps/driver
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK de Producción Ligero (32-bit armeabi-v7a + 64-bit arm64-v8a)
        working-directory: apps/driver
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Copiar, renombrar y mostrar peso del APK
        run: |
          if [ -f apps/driver/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp apps/driver/build/app/outputs/flutter-apk/app-release.apk UrbanRide-Driver.apk
          else
            cp apps/driver/build/app/outputs/apk/release/app-release.apk UrbanRide-Driver.apk
          fi
          ls -lh UrbanRide-Driver.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: UrbanRide-Driver-APK
          path: UrbanRide-Driver.apk
          retention-days: 30

      - name: Generar tag dinámico
        id: tag
        run: echo "TAG=v$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "UrbanRide Conductor ${{ steps.tag.outputs.TAG }} (APK Android)"
          body: |
            ### 🚖 UrbanRide Conductor - APK Nativo para Android
            Descarga e instala el archivo **UrbanRide-Driver.apk** adjunto directamente en tu móvil Android.

            - **Aplicación:** UrbanRide Conductor (`urbanride_driver`)
            - **Paquete:** `com.urbanride.urbanride_driver`
            - **Compatibilidad:** Universal (`armeabi-v7a` 32-bit y `arm64-v8a` 64-bit)
            - **Peso aproximado:** ~16-18 MB (símbolos de depuración eliminados)
            - **Funciones:** GPS en tiempo real, recepción de viajes por Socket.IO, modo Tarifa Fija (Uber) y Subasta (InDrive)
          files: UrbanRide-Driver.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
